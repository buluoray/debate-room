name: test

on:
  pull_request:
  push:
    branches: [trunk]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # AGENTS.md says Python 3.10 or later; test the oldest one we support.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI deps
        run: npm ci --no-audit --no-fund
        working-directory: ui
      - name: Run tests
        run: ./scripts/test.sh
